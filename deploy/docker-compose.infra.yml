services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dauth
      POSTGRES_PASSWORD: dauth
      POSTGRES_DB: dauth
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - dauth-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dauth"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  dauth-pg:
