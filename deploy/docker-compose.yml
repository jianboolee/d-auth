# ============================================================
# d-auth 生产部署（自建服务器 / docker compose）
#
#   对外统一端口 8680：控制台 + /v1 API
#   用法：
#     cp deploy/.env.example deploy/.env   # 至少填 POSTGRES_PASSWORD、DAUTH_MASTER_KEY
#     docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d
# ============================================================

services:
  app:
    image: ${DOCKER_IMAGE:-jianboo/d-auth}:${DOCKER_TAG:-latest}
    container_name: dauth-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: production
      HTTP_PORT: "8681"
      DAUTH_PUBLIC_URL: ${DAUTH_PUBLIC_URL:-}
      DAUTH_WEB_ORIGIN: ${DAUTH_WEB_ORIGIN:-}
      DAUTH_JWT_ISSUER: ${DAUTH_JWT_ISSUER:-${DAUTH_PUBLIC_URL:-}}
      DAUTH_JWT_PRIVATE_KEY_PATH: /app/data/jwt-private.pem
      DAUTH_COOKIE_DOMAIN: ${DAUTH_COOKIE_DOMAIN:-}
      DAUTH_COOKIE_SECURE: ${DAUTH_COOKIE_SECURE:-true}
      DAUTH_COOKIE_NAME: ${DAUTH_COOKIE_NAME:-__Secure-dauth_session}
      DAUTH_ALLOWED_ORIGINS: ${DAUTH_ALLOWED_ORIGINS:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-dauth}:${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dauth}?sslmode=disable
      REDIS_ADDR: redis:6379
      DAUTH_MASTER_KEY: ${DAUTH_MASTER_KEY:?请在 .env 中设置 DAUTH_MASTER_KEY}
      DAUTH_INIT_ADMIN_PHONE: ${DAUTH_INIT_ADMIN_PHONE:-}
      DAUTH_INIT_ADMIN_EMAIL: ${DAUTH_INIT_ADMIN_EMAIL:-}
      DAUTH_ALIYUN_ACCESS_KEY_ID: ${DAUTH_ALIYUN_ACCESS_KEY_ID:-}
      DAUTH_ALIYUN_ACCESS_KEY_SECRET: ${DAUTH_ALIYUN_ACCESS_KEY_SECRET:-}
      DAUTH_ALIYUN_SMS_SIGN_NAME: ${DAUTH_ALIYUN_SMS_SIGN_NAME:-}
      DAUTH_ALIYUN_SMS_TEMPLATE_LOGIN: ${DAUTH_ALIYUN_SMS_TEMPLATE_LOGIN:-}
      DAUTH_ALIYUN_SMS_TEMPLATE_BIND: ${DAUTH_ALIYUN_SMS_TEMPLATE_BIND:-}
      DAUTH_ALIYUN_SMS_TEMPLATE_RESET: ${DAUTH_ALIYUN_SMS_TEMPLATE_RESET:-}
      DAUTH_ALIYUN_DM_ACCOUNT: ${DAUTH_ALIYUN_DM_ACCOUNT:-}
      DAUTH_ALIYUN_DM_FROM_ALIAS: ${DAUTH_ALIYUN_DM_FROM_ALIAS:-d-auth}
      DAUTH_OSS_ENDPOINT: ${DAUTH_OSS_ENDPOINT:-}
      DAUTH_OSS_BUCKET: ${DAUTH_OSS_BUCKET:-}
      DAUTH_OSS_CDN_BASE: ${DAUTH_OSS_CDN_BASE:-}
      DAUTH_WECHAT_WEB_APP_ID: ${DAUTH_WECHAT_WEB_APP_ID:-}
      DAUTH_WECHAT_WEB_APP_SECRET: ${DAUTH_WECHAT_WEB_APP_SECRET:-}
      DAUTH_WECHAT_REDIRECT_URL: ${DAUTH_WECHAT_REDIRECT_URL:-}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${APP_PORT:-8680}:80"
    volumes:
      - app_data:/app/data

  postgres:
    image: postgres:16-alpine
    container_name: dauth-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dauth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-dauth}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    # 默认不对外暴露数据库端口；确需从宿主机直连时再打开
    # ports:
    #   - "127.0.0.1:5432:5432"

  redis:
    image: redis:7-alpine
    container_name: dauth-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  app_data:
