# d-auth 业务机 vhost（裸机部署，装在业务机 47.95.176.70 的 /etc/nginx/conf.d/）
#
# 逐条对齐 docker/nginx.conf，差别只有两处：
#   1. 监听 8680（而不是容器内的 80）。这与容器方案映射出来的宿主机端口一致 ——
#      入口机 39.107.77.69 的 proxy_pass http://172.17.255.64:8680 因此完全
#      不用改，两套方案对上游零差别。
#   2. root 指向 /opt/d-auth/web（而不是镜像里的 /usr/share/nginx/html）。
#
# 本文件必须被 include 在 http 上下文（CentOS / Alinux 的 nginx.conf 默认在
# http { } 内 include conf.d/*.conf，munge 的 map 因此可以放在这里）。
#
# 部署：deploy/baremetal/install.sh 会自动下发；手动改完记得 nginx -t && systemctl reload nginx
#
# ⚠️ SELinux 为 Enforcing 时需要：
#      chcon -R -t httpd_sys_content_t /opt/d-auth/web
#    否则 nginx 返回 403。install.sh 会检测并提示。
# ⚠️ 入口机 IP 必须在 .env.prod 的 DAUTH_TRUSTED_PROXIES 里（原值已含 172.17.255.63）。

# 入口机已做 TLS 终结，它传下来的 X-Forwarded-Proto 是 https；只有直连
# （比如本机 curl）才回落到 $scheme。容器版这里一律写死 $scheme，会把
# https 降级成 http —— 这个 map 修掉了该问题。
map $http_x_forwarded_proto $dauth_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 8680;
    server_name _;

    root /opt/d-auth/web;
    index index.html;
    client_max_body_size 8m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location /v1/ {
        proxy_pass http://127.0.0.1:8681;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $dauth_forwarded_proto;
        proxy_set_header Connection "";
    }

    location /health {
        proxy_pass http://127.0.0.1:8681;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $dauth_forwarded_proto;
        access_log off;
    }

    location /static/ {
        proxy_pass http://127.0.0.1:8681;
        proxy_set_header Host $host;
        expires 7d;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}