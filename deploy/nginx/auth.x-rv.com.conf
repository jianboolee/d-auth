# auth.x-rv.com.conf
# d-auth 账户中心 —— 外层 nginx（入口机 39.107.77.69 / 172.17.255.63）
# 反代到业务机（47.95.176.70 / 172.17.255.64）的容器 nginx:80
#
# 部署：本目录 ./upload.sh（或仓库根目录 make nginx-push）
# 手动：scp 到入口机 /etc/nginx/conf.d/ 后 nginx -t && systemctl reload nginx
#
# ⚠️ 证书在 /home 下：确认 nginx 用户对 /home、/home/ssl/x-rv.com 有 x 权限且能读该文件。
#    入口机 SELinux 已核实为 Disabled，无需 chcon。
# ⚠️ 业务机需在 DAUTH_TRUSTED_PROXIES 中包含 172.17.255.63，否则 IP 限流会误封全体用户。

# ======================================
# HTTP：强制跳转 HTTPS
# ======================================
server {
    listen 80;
    server_name auth.x-rv.com;

    return 301 https://$host$request_uri;
}

# ======================================
# HTTPS
# ======================================
server {
    listen 443 ssl http2;
    server_name auth.x-rv.com;

    ssl_certificate /home/ssl/x-rv.com/x-rv.com.pem;
    ssl_certificate_key /home/ssl/x-rv.com/x-rv.com.key;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    access_log /mnt/log/nginx/auth.x-rv.com_access.log main;
    error_log /mnt/log/nginx/auth.x-rv.com_error.log;

    client_max_body_size 8m;

    location /v1/ {
        proxy_pass http://172.17.255.64:8680;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_redirect off;
    }

    location /health {
        proxy_pass http://172.17.255.64:8680;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    location / {
        proxy_pass http://172.17.255.64:8680;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
