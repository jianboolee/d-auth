# auth.x-rv.com.conf
# d-auth 账户中心 —— 外层 nginx 反代到宿主机 8680（容器内 nginx:80）
#
# 部署：本目录 ./upload.sh（或仓库根目录 make nginx-push）
# 手动：scp 到服务器 /etc/nginx/conf.d/ 后 nginx -t && systemctl reload nginx

# ======================================
# HTTP：强制跳转 HTTPS
# ======================================
server {
    listen 80;
    server_name auth.x-rv.com;

    return 301 https://$host$request_uri;
}

# ======================================
# HTTPS
# ======================================
server {
    listen 443 ssl http2;
    server_name auth.x-rv.com;

    ssl_certificate /mnt/ssl/x-rv.com.pem;
    ssl_certificate_key /mnt/ssl/x-rv.com.key;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    access_log /mnt/log/nginx/auth.x-rv.com_access.log main;
    error_log /mnt/log/nginx/auth.x-rv.com_error.log;

    client_max_body_size 8m;

    location /v1/ {
        proxy_pass http://127.0.0.1:8680;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_redirect off;
    }

    location /health {
        proxy_pass http://127.0.0.1:8680;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8680;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
