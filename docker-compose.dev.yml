# ============================================================
# d-auth 本地开发栈（热重载，不构建发布镜像）
#
#   make docker-dev
#   访问 http://localhost:8682
# ============================================================

services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    working_dir: /src
    command: air -c .air.toml
    volumes:
      - ./api:/src
      - go_mod_cache:/go/pkg/mod
      - go_build_cache:/root/.cache/go-build
    env_file:
      - .env
    environment:
      HTTP_PORT: "8681"
      # 容器内 localhost 不是宿主机；infra 用默认端口 5432/6379
      DAUTH_POSTGRES_DSN: postgres://dauth:dauth@host.docker.internal:5432/dauth?sslmode=disable
      DAUTH_REDIS_ADDR: host.docker.internal:6379
      DAUTH_WEB_ORIGIN: http://localhost:${WEB_PORT:-8682}
      DAUTH_ALLOWED_ORIGINS: http://localhost:${WEB_PORT:-8682},http://127.0.0.1:${WEB_PORT:-8682}
    ports:
      - "${API_PORT:-8681}:8681"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  web:
    image: node:22-alpine
    working_dir: /src
    command: sh -c "npm ci --no-audit --no-fund && npm --prefix web run dev"
    volumes:
      - ./:/src
      - web_node_modules:/src/node_modules
      - web_pkg_node_modules:/src/web/node_modules
    environment:
      DAUTH_API_TARGET: http://api:8681
      WEB_PORT: "8682"
      DAUTH_VITE_POLL: "${DAUTH_VITE_POLL:-}"
    ports:
      - "${WEB_PORT:-8682}:8682"
    depends_on:
      - api

volumes:
  go_mod_cache:
  go_build_cache:
  web_node_modules:
  web_pkg_node_modules:
